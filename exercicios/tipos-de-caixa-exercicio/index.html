<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display no CSS: Block, Inline, Inline-Block e Flex</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Display no CSS: Block, Inline, Inline-Block e Flex</h1>

    <section>
      <h2>display: block</h2>

      <p>Algum texto aleatório</p>

      <div class="container block">
        <div class="box">A</div>
        <div class="box">B</div>
        <div class="box">C</div>
      </div>
    </section>

    <section>
      <h2>display: inline</h2>

      <div class="container inline">
        <span class="box">A</span>
        <span class="box">B</span>
        <span class="box">C</span>
      </div>
    </section>

    <section>
      <h2>display: inline-block</h2>

      <div class="container inline-block">
        <div class="box">A</div>
        <div class="box">B</div>
        <div class="box">C</div>
      </div>
    </section>

    <section>
      <h2>display: flex</h2>

      <div class="container flex">
        <div class="box">A</div>
        <div class="box">B</div>
        <div class="box">C</div>
        <!-- <div class="box">A</div>
        <div class="box">B</div>
        <div class="box">C</div>
        <div class="box">A</div>
        <div class="box">B</div>
        <div class="box">C</div>
        <div class="box">B</div>
        <div class="box">C</div> -->
      </div>
    </section>
  </body>
</html>
