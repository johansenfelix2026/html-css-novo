<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de caixas</title>
    <style>
        label{
            background-color: aqua;
        }
        h1{
            background-color: aqua;
            height: 100px;
            width: 500px;
            /*shorthend*/
            border: 5px solid black; /* com shorthend*/
            
            padding: 10px 20px; /* com shorthend*/
            /* depois do padding*/
            margin: 10px 20px 50px 10px; /* com shorthend*/
            /* traçejado depois da borda*/
            outline: 2px dashed red; /* com shorthend*/
            
           
                   }
        a{

            background-color: rgb(148, 221, 12);
           
           border: 2px dotted burlywood;
            
        }
    </style>
</head>
<body>
    <h1>Exemplos de caixa block-level</h1>
    <p>Parágrafos também são exemplos de block-levels, mas os <a href="#"> links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona. </p>
    
    <input type="radio" id="opcao1" name="grupo" value="valor1">
<label for="opcao1">Opção 1</label>
</body>
</html>
