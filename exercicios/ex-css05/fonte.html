<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas 02</title>
    <style>
        @font-face {
            font-family:'exticion';
            src: url(fontes/Ambarella.otf) format(opentype), url(fontes/Ambarella.ttf) format(truetype);
            font-weight: normal;
            font-style: normal;

            /* tipos de format()
            -opentype (otf)
            -truetype (ttf)
            embedded-opentype
            truetype-aat (apple advenced typography)
            svg*/
        }
        body{

            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            font-family: 'exticion', Times, serif;
            font-size: 4em;
            height: 50px;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Titulo</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quidem assumenda velit cum neque. Adipisci asperiores ducimus maxime, quo velit, illo corporis quam pariatur facilis atque nobis necessitatibus aliquid saepe neque!</p>
    
</body>
</html>
