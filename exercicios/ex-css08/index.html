<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de caixa</title>
    <style>
        h1 {
           
            background-color: antiquewhite;
            width: 300px;
            height: 300px;


            border: 10px ridge black 10px;

            padding: 10px 10px;



            margin: 30px auto 40px auto;


           
            outline: 5px dashed red;


        }

        a {
            border-width: 5px;
            border-style: ridge;
            border-color: rgb(255, 0, 170);
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            text-align: center;


        }
        p{
            text-align: center;
        }
        
    </style>

</head>

<body>
    <h1>Exemplos de caixas box-level</h1>
    <p>Paragráfos tambem são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>.
        Vamos ver como tudo isso funciona</p>


</body>

</html>
