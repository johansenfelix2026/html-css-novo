<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <link rel="icon" href="imagens/suporte-do-site.png" type="image/png">
    <style>
        body {

            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        table {

            border-collapse: collapse;
            width: 300px;
        }

        .cor{

            background-color: aqua;
        }

        td{

            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>mesclagem de celulas</h1>
    <table>
        <tr>
            <td>A</td>
            <td colspan="2">B</td>
            
        </tr>

        <tr>
            <td rowspan="3">D</td>
            <td>E</td>
            <td rowspan="2">F</td>
        </tr>

        <tr>
            
            <td>H</td>
           
        </tr>

        <tr>
            
            <td colspan="2" class="cor" >L</td>
            
        </tr>
    </table>
</body>

</html>
