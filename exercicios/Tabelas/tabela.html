<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha primeira tabela</title>
    <style>
        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-weight: bold;
            font-size: 1rem;
            padding-left: 10px;
        }

        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
        
        }

        /* Formata apenas as células de cabeçalho */
        th {
            height: 100px;
            background-color: aqua;
            border: 1px solid black;
            padding: 3px;
            
                
        }

        td, th{
            text-align:center;  /*Alinha o texto à esquerda como os TDs */

            vertical-align:middle; 


        }

        td {
            border: 1px solid black;
            padding: 3px;
        }

        /* Automatização: Pinta a primeira coluna (célula) de todas as linhas de dados */
        tr td:first-child {
            color: antiquewhite;
            background-color: blueviolet;
        }

        /* Extra opcional: Como pintar linhas alternadas automaticamente (efeito zebra) */
        /* 
        tr:nth-child(even) {
            background-color: #f2f2f2;
        } 
        */
    </style>
</head>

<body>
    <h1>Minha primeira tabela</h1>
    <table>
        <thead>
            <tr>
                <!-- th indica que é um cabeçalho (Header) -->
                <th>A1</th>
                <th>B1</th>
                <th>C1</th>
            </tr>
        </head>
        <tbody>
            <tr>
                <td>A2</td>
                <td>B2</td>
                <td>C2</td>
            </tr>
            <tr>
                <td>A3</td>
                <td>B3</td>
                <td>C3</td>
            </tr>
            <tr>
                <td>A4</td>
                <td>B4</td>
                <td>C4</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
