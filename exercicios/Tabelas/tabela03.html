<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas Grandes</title>
    <style>
        
    </style>
</head>

<body>
    <h1>Uso de tabelas grandes</h1>
    <!--ANATOMIA DAS TABELAS GRANDES
    *THEAD - CABEÇA-----
              [TR, TD TH]
    *TBODY - CORPO------
              [TR, TD TH]
    *TFOOT - RODA PÉ-----
              [TR, TD TH]
    
    -->
    <table>


        <thead><!--cabeça-->
            <th>Estado</th>
            <th>População</th>
            <th>Pais</th>

        </thead>

        <tbody><!--corpo-->
            <th>São paulo</th>
            <th>46 179 008 </th>
            <th>Argentina</th>

        </tbody>

        <tfoot><!--roda pé-->
            <th>Total</th>
            <th>214 211 951</th>
            <th>Turquia</th>

        </tfoot>






    </table>


</body>

</html>
