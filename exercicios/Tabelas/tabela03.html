<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas Grandes</title>
    <style>
        body > h1{
            font-family: Arial, Helvetica, sans-serif;

            
            padding: 5px;
                        
        }
        table{

            width: 500px;
            height: 75px;
            text-align: left;
             border-collapse: collapse;
           
        }
        thead{
            background-color: chartreuse;

            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        td, th{
             border:1px solid black;
             padding: 10px;
            

        }
    </style>
</head>

<body>
    <h1>Uso de tabelas grandes</h1>
    <!--ANATOMIA DAS TABELAS GRANDES
    *THEAD - CABEÇA-----
              [TR, TD TH]
    *TBODY - CORPO------
              [TR, TD TH]
    *TFOOT - RODA PÉ-----
              [TR, TD TH]
    
    -->
    <table>


        <thead><!--cabeça-->
            <th></th>
            <th>Estado</th>
            <th>População</th>
            <th>Pais</th>

        </thead>

        <tbody><!--corpo-->
            <th></th>
            <th>São paulo</th>
            <th>46 179 008 </th>
            <th>Argentina</th>

        </tbody>

        <tfoot><!--roda pé-->
            <th></th>
            <th>Total</th>
            <th>214 211 951</th>
            <th>Turquia</th>

        </tfoot>






    </table>


</body>

</html>
