<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas Grandes</title>
    <style>
        caption{

            font-size: 1.2rem;
            font-weight: bold;
            padding: 10px;
            background-color: bisque;
        }

        body{

            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        table{

        
        padding: 10px;
        width: 600PX;
        border-collapse: collapse;
 
        }
        thead {

            background-color:aqua;
           
        }
        td, th{
            border: 1px solid black;
        }
        td.num{
            text-align:center;
            
        }
        
        tfoot{

            background-color: darkgrey;
        }
    </style>

</head>

<body>
    <h1>Uso de tabelas grandes</h1>
    <!--caption ou legendas-->
    <!-- 
      HIERARQUIA DE TABELAS (simples)
        TABLE = tabela
        TABLE ROW = linha de tabela
        TABLE HEADER = cabeçalho de tabela
        TABLE DATA = dado de tabela
  -->
    <!--ANATOMIA DAS TABELAS GRANDES
    *THEAD - CABEÇA-----
              [TR, TD TH]
    *TBODY - CORPO------
              [TR, TD TH]
    *TFOOT - RODA PÉ-----
              [TR, TD TH]
    
    -->
    <table>
        <caption>Unidades Federativas</caption>

        <thead>
            <tr>
                <th scope="col">ESTADOS</th>
                <th scope="col" style="width: 200px;">POPULAÇÃO EM 2026</th>
                <th scope="col">REGIÃO</th>
            </tr>
        </thead>

        <tbody>
             <tr>
                <td>MANAUS</td>
                <td class="num">89 015 421</td>
                <td>NORTE</td>
                
            </tr>
            <tr>
                <td>PARÁ</td>
                <td class="num">57 366 981</td>
                <td>NORTE</td>
            </tr>
            <tr>
                <td>SÃO PAULO</td>
                <td class="num">17 401 676</td>
                <td>SUL</td>
            </tr>
        </tbody>

        <tfoot>
            
            <tr>
                <th scope="row">Total</th>
                <td class="num">214 211 951</td>
                <td><strong>41,55%</strong></td>
            </tr>
            
            
        </tfoot>










    </table>


</body>

</html>
