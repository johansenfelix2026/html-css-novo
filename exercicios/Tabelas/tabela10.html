<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EXERCÍCIOS TABELAS</title>
    <style>
      body {
        font: 1em sans-serif;
        font-weight: bolder;
        font-size: 1.2rem;
      }

      caption {
        font-size: 1.2rem;
        font-weight: bolder;
        background-color: aquamarine;
        border: 1px solid black;
      }
      table {
        width: 1000px;
        border-collapse: collapse;
      }
      td,
      th {
        padding: 10px;
        border: 1px solid black;
      }
      th {
        background-color: rgb(124, 122, 122);
        color: aliceblue;
      }

      .media {
        text-align: left;
      }
      .meio {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>EXERCÍCIOS TABELAS</h1>
    <table>
      <caption>
        EXERCÍCIOS TABELAS 10
      </caption>
      <thead>
        <tr>
          <th rowspan="2">ÁREA</th>
          <th rowspan="2">DISCIPLINA</th>
          <th colspan="2">NOTA</th>
          <th rowspan="2">MÉDIA</th>
        </tr>
        <th>NOTA 01</th>
        <th>NOTA 02</th>
      </thead>
      <tbody>
        <tr>
          <td rowspan="4" class="meio"><strong>EXATAS</strong></td>
          <td>MATEMÁTICA</td>
          <td>0.0</td>
          <td>0.0</td>
          <td>0.0</td>
        </tr>

        <tr>
          <td>QUIMICA</td>
          <td>0.0</td>
          <td>0.0</td>
          <td>0.0</td>
        </tr>

        <tr>
          <td>FÍSICA</td>
          <td>0.0</td>
          <td>0.0</td>
          <td>0.0</td>
        </tr>

        <tr>
          <td>BIOLOGIA</td>
          <td>0.0</td>
          <td>0.0</td>
          <td>0.0</td>
        </tr>

        <tr>
          <th colspan="4" class="media">MÉDIAS EXATAS</th>
          <th class="media">0.0</th>
        </tr>

        <tr>
          <td rowspan="2" class="meio"><strong>HUMANAS</strong></td>
          <td>HISTÓRIA</td>
          <td>0.0</td>
          <td>0.0</td>
          <td>0.0</td>
        </tr>

        <tr>
          <td>GEOGRAFIA</td>
          <td>0.0</td>
          <td>0.0</td>
          <td>0.0</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <th colspan="4" class="media">MÉDIAS DE HUMANAS</th>
          <th class="media">0.0</th>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
